name: Tests
on:
  push:
    branches-ignore: [main]   # main runs these through the APK workflow
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test tools
        run: npm ci
      - name: Lint web UI, Tizen layer and tests
        run: npm run lint
      - name: Unit and Live TV tests
        run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
      - name: Samsung Tizen build tests
        run: npm run test:tizen
      - name: Build Samsung Tizen app folder
        run: npm run build:tizen
      - name: Upload Samsung Tizen app folder
        uses: actions/upload-artifact@v4
        with:
          name: EasyPlex-tizen-app
          path: build/tizen/app
          if-no-files-found: error
